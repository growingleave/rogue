<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>파츠 판 초안</title>
  </head>
  <body>
    <main class="layout">
      <section class="arena-wrap">
        <canvas id="arena"></canvas>
        <p class="hint">이동: WASD·방향키, 또는 화면을 누르고 끌기</p>
      </section>
      <aside class="side">
        <div class="toolbar">
          <h1>파츠 판</h1>
          <select id="presets" aria-label="준비된 배치"></select>
          <button id="wire" class="tool">배선</button>
          <button id="clear" class="tool">비우기</button>
        </div>
        <div id="board" class="board-wrap"></div>
        <div id="info" class="info"></div>
        <div id="palette" class="palette"></div>
        <p class="note">초안: 테스트를 위해 전투 중에도 판을 바꿀 수 있다. 모든 수치는 임시값이다.</p>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
